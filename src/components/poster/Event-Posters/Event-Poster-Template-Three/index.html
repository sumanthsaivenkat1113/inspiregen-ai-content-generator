<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronic Journey Friday Night Poster</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="poster-container">
        <div class="grid-overlay"></div>
        <div class="light-beam beam-1"></div>
        <div class="light-beam beam-2"></div>
        <div class="light-beam beam-3"></div>

        <header class="header">
            <h1 class="title">Electronic Journey Friday Night</h1>
            <p class="tagline">Let the Rhythm Move You</p>
        </header>

        <section class="main-content">
            <img src="https://images.unsplash.com/photo-1506157786151-b8491531f063?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="DJ performing with intense laser light show" class="main-image">
            
            <div class="icon-pulse">
                <i class="fas fa-headphones-alt icon-item"></i>
                <i class="fas fa-waveform icon-item"></i>
                <i class="fas fa-drum-steelpan icon-item"></i> <!-- Using steelpan for general electronic beat --><i class="fas fa-users-viewfinder icon-item"></i> <!-- Representing dancing crowd --></div>

            <p class="message">Immerse yourself in a world of sound and light.</p>
        </section>

        <footer class="footer">
            <a href="#" class="cta">Get your tickets and lose yourself in the beat!</a>
        </footer>
    </div>
</body>
</html>
