<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Soundwave Festival Poster V2</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="poster-container-v2">
        <div class="dynamic-shape shape-1"></div>
        <div class="dynamic-shape shape-2"></div>
        <div class="dynamic-shape shape-3"></div>

        <header class="header">
            <h1 class="title">The Summer Soundwave Festival</h1>
            <p class="tagline">Feel the Beat, Live the Heat</p>
        </header>

        <section class="main-content">
            <div class="image-clip">
                <img src="https://images.unsplash.com/photo-1429962714451-bb934ecdc4ec?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3Dv" alt="DJ on stage with colorful laser lights" class="festival-image">
            </div>
            
            <p class="message">
                Where sun-kissed days meet electrifying nights.
            </p>

            <div class="feature-icons">
                <div class="icon-block">
                    <i class="fas fa-compact-disc"></i>
                    <span>DJs & Artists</span>
                </div>
                <div class="icon-block">
                    <i class="fas fa-cloud-sun"></i>
                    <span>Day & Night</span>
                </div>
                <div class="icon-block">
                    <i class="fas fa-cocktail"></i>
                    <span>Food & Drinks</span>
                </div>
            </div>
        </section>

        <footer class="footer">
            <a href="#" class="cta">Grab your tickets and ride the wave!</a>
        </footer>
    </div>
</body>
</html>
