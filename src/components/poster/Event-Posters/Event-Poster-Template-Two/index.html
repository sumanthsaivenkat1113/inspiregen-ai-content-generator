<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Art & Music Night Poster V2</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="poster-container-v2">
        <div class="background-wave-abstract wave-1"></div>
        <div class="background-wave-abstract wave-2"></div>
        <div class="background-splatter"></div>

        <header class="header">
            <h1 class="title">Live Art & Music Night</h1>
            <p class="tagline">Where Creativity Meets the Beat</p>
        </header>

        <section class="main-content">
            <div class="image-mask">
                <img src="https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Abstract art with musical elements" class="main-image">
            </div>
            
            <p class="message">
                Witness art unfold to a live soundtrack.
            </p>

            <div class="event-details">
                <div class="detail-item">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Date: Coming Soon!</span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>Venue: Downtown Gallery</span>
                </div>
            </div>
        </section>

        <footer class="footer">
            <a href="#" class="cta">Be part of the masterpiece. Join us!</a>
        </footer>
    </div>
</body>
</html>
