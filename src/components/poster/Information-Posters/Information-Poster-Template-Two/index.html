<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Environment Poster</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="poster-container">
        <header class="header">
            <h1 class="title">Save the Environment</h1>
            <p class="tagline">Our Planet, Our Future</p>
        </header>

        <section class="main-content">
            <img src="https://images.unsplash.com/photo-1585871746932-e133d3fedf4d?q=80&w=770&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Hands holding a vibrant green earth" class="environment-image">
            
            <div class="icon-grid">
                <i class="fas fa-leaf icon-item"></i>
                <i class="fas fa-recycle icon-item"></i>
                <i class="fas fa-seedling icon-item"></i>
                <i class="fas fa-tree icon-item"></i>
            </div>

            <p class="message">Every small action creates a wave of change.</p>
        </section>

        <footer class="footer">
            <a href="#" class="cta">Start your journey. Act now.</a>
        </footer>
    </div>
</body>
</html>
