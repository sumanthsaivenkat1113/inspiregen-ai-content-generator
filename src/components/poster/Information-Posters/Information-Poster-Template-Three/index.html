<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Awareness Poster V3</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="poster-container-v3">
        
        <div class="abstract-shape shape-top"></div>
        <div class="abstract-shape shape-bottom"></div>

        <header class="header">
            <h1 class="title">Your Health Is A Priority</h1>
            <p class="tagline">Your Mind Matters</p>
        </header>

        <section class="main-content">
            <img src="https://images.unsplash.com/photo-1604881991720-f91add269bed?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Minimalist illustration of a person growing or blooming" class="growth-image">
            
            <p class="message">
                It's okay to not be okay.<br> Your feelings are valid.
            </p>

            <div class="support-elements">
                <i class="fas fa-seedling icon-grow"></i>
                <i class="fas fa-hand-holding-medical icon-care"></i>
            </div>
        </section>

        <footer class="footer">
            <a href="#" class="cta">Reach out. Speak up. Heal together.</a>
        </footer>
    </div>
</body>
</html>
