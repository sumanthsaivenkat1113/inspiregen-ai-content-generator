<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Turtle Life Cycle Poster</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="poster-container">
        <header class="header">
            <h1 class="title">The Turtle Life Cycle: <br> A Visual Guide</h1>
            <p class="tagline">From Tiny Hatchling to Ocean Voyager</p>
        </header>

        <section class="main-content">
            <img src="https://plus.unsplash.com/premium_photo-1675432656807-216d786dd468?q=80&w=690&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="A tiny sea turtle hatchling heading to the ocean" class="turtle-image">
            
            <div class="life-cycle-icons">
                <div class="icon-stage">
                    <i class="fas fa-egg"></i>
                    <span>Egg</span>
                </div>
                <i class="fas fa-arrow-right arrow-icon"></i>
                <div class="icon-stage">
                    <i class="fas fa-baby"></i>
                    <span>Hatchling</span>
                </div>
                <i class="fas fa-arrow-right arrow-icon"></i>
                <div class="icon-stage">
                    <i class="fas fa-circle-notch"></i> <span>Juvenile</span>
                </div>
                <i class="fas fa-arrow-right arrow-icon"></i>
                <div class="icon-stage">
                    <i class="fas fa-turtle"></i>
                    <span>Adult</span>
                </div>
            </div>

            <p class="message">An ancient journey of resilience and survival.</p>
        </section>

        <footer class="footer">
            <a href="#" class="cta">Protect their voyage for generations to come.</a>
        </footer>
    </div>
</body>
</html>
